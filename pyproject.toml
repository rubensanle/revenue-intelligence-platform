[project]
name = "revenue-intelligence-platform"
version = "0.1.0"
description = "From retail transactions to AI-powered decisions: analytics, forecasting and an LLM copilot grounded in verified data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rubén Sánchez Leal", email = "rubensanle@gmail.com" }
]

dependencies = [
    # Datos y análisis
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",

    # Bases de datos
    "duckdb>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # Modelado
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsmodels>=0.14",

    # Visualización
    "plotly>=5.20",
    "streamlit>=1.33",

    # API y validación
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",

    # Utilidades
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"